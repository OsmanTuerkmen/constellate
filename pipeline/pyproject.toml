[project]
name = "constellate-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "networkx>=3.3",
  "pydantic>=2.8",
  "openai>=1.50",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "lxml>=5.2",
  "rapidfuzz>=3.14.6",
  "numpy>=2.0",
  "openpyxl>=3.1.5",
  "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
